name: Publish to News Channel Daily

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-news-channel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: concepts/news_collecting/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r concepts/news_collecting/requirements.txt

      - name: Run news_channel.py
        working-directory: concepts/news_collecting
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MEGA_YAHOO_USERNAME: ${{ secrets.MEGA_YAHOO_USERNAME }}
          MEGA_YAHOO_PASSWORD: ${{ secrets.MEGA_YAHOO_PASSWORD }}
        run: python news_channel.py --noAI