services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cv-backend
    volumes:
      - ./user_profile.json:/app/user_profile.json
      - ./trainingData:/app/trainingData
    restart: unless-stopped
    networks:
      - cv-net

  nginx:
    image: nginx:alpine
    container_name: cv-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cv-net

networks:
  cv-net:
    driver: bridge
