services:
  cv-creator:
    build:
      context: .
      dockerfile: Dockerfile.cv-creator
    container_name: cv-creator
    volumes:
      # Shared profile JSON so both apps read/write the same file
      - ./user_profile.json:/app/user_profile.json
    restart: unless-stopped
    networks:
      - cv-net

  profiling:
    build:
      context: .
      dockerfile: Dockerfile.profiling
    container_name: profiling
    volumes:
      # Shared profile JSON
      - ./user_profile.json:/app/user_profile.json
      # Training data for markdown CV scanning
      - ./trainingData:/app/trainingData
    restart: unless-stopped
    networks:
      - cv-net

  nginx:
    image: nginx:alpine
    container_name: cv-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cv-creator
      - profiling
    restart: unless-stopped
    networks:
      - cv-net

networks:
  cv-net:
    driver: bridge
