upstream cv-creator {
    server cv-creator:8501;
}

upstream profiling {
    server profiling:8502;
}

server {
    listen 80;
    server_name _;

    # ── CV Creator (/cv) ─────────────────────────────────────────────────
    location /cv {
        proxy_pass http://cv-creator/cv;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Streamlit uses WebSockets)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Streamlit static assets & internal API for CV Creator
    location /cv/_stcore {
        proxy_pass http://cv-creator/cv/_stcore;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # ── Profile Manager (/profile) ───────────────────────────────────────
    location /profile {
        proxy_pass http://profiling/profile;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Streamlit static assets & internal API for Profile Manager
    location /profile/_stcore {
        proxy_pass http://profiling/profile/_stcore;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # ── Root redirect ────────────────────────────────────────────────────
    location = / {
        return 302 /cv;
    }
}
