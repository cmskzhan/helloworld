<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Local AI CV Tailor</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div id="app">
    <header>
      <h1>📄 AI CV Tailor</h1>
      <nav>
        <a href="index.html" class="active">Tailor CV</a>
        <a href="profile.html">Profile Manager</a>
      </nav>
    </header>

    <div class="glass-panel">
      <h2>API Settings</h2>
      <div class="grid">
        <div class="form-group">
          <label for="api-key">Gemini API Key</label>
          <input type="password" id="api-key" placeholder="Enter API Key" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="model-name">Select Model</label>
          <select id="model-name">
            <option value="">Enter API key to load models...</option>
          </select>
        </div>
      </div>
    </div>

    <div class="glass-panel" id="profile-status" style="display: none;">
      <h3 style="margin-bottom:0.5rem">✅ Saved Profile Detected</h3>
      <p style="color:var(--text-secondary); margin-bottom:1rem;" id="profile-status-text">
        You can generate a CV without uploading files.
      </p>
    </div>

    <div class="grid">
      <div class="glass-panel">
        <h2>Input Context</h2>
        
        <div class="form-group">
          <label for="jd">Target Job Description (JD)</label>
          <textarea id="jd" rows="8" placeholder="Paste the job description here..."></textarea>
        </div>
        
        <div class="form-group" id="use-profile-wrapper" style="display:none;">
          <label>
            <input type="checkbox" id="use-profile" checked> 
            Use saved profile (user_profile.json)
          </label>
        </div>
        
        <div class="form-group">
          <label for="cv-uploads">Upload Current CVs (optional if profile is saved)</label>
          <input type="file" id="cv-uploads" multiple accept=".pdf,.doc,.docx,.md" style="font-size: 0.9rem; margin-top: 0.5rem">
        </div>
      </div>

      <div class="glass-panel d-flex flex-column">
        <h2>Generation Settings</h2>
        
        <p style="margin-bottom: 1rem; color:var(--text-secondary); font-size:0.9rem;">
          The AI will merge your experience and prioritize skills found in the JD.
        </p>

        <div class="form-group">
          <label for="focus">Special Focus</label>
          <input type="text" id="focus" placeholder="e.g. 'Focus on Cloud Architecture'">
        </div>

        <button id="generate-btn" style="width: 100%; margin-top: 2rem;">
          <span id="gen-btn-text">✨ Generate Tailored CV</span>
          <div class="loader hidden" id="gen-loader"></div>
        </button>
      </div>
    </div>

    <div id="results-panel" class="glass-panel hidden">
      <div class="results-header">
        <h2>Review & Edit</h2>
        <div class="view-toggle">
          <button id="view-split" class="toggle-btn active" title="Split view">⬌ Split</button>
          <button id="view-editor" class="toggle-btn" title="Editor only">✏️ Editor</button>
          <button id="view-preview" class="toggle-btn" title="Preview only">👁️ Preview</button>
        </div>
      </div>
      <div id="editor-preview-container" class="editor-preview-container">
        <div id="editor-pane" class="editor-pane">
          <label class="pane-label">Markdown Source</label>
          <textarea id="cv-md" class="cv-md-textarea"></textarea>
        </div>
        <div id="preview-pane" class="preview-pane">
          <label class="pane-label">Rendered Preview</label>
          <div id="cv-preview" class="cv-preview-content"></div>
        </div>
      </div>
      
      <div class="grid" style="margin-top: 1rem;">
        <button id="download-docx" class="secondary">⬇️ Download Word (.docx)</button>
        <button id="download-pdf" class="secondary">⬇️ Download PDF (.pdf)</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
